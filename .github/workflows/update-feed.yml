name: Update X RSS feed

on:
  push:
    branches:
      - main
  schedule:
    # 北京时间每天 07:00、11:00、20:00（UTC 前一天 23:00、当天 03:00、12:00）。
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: x-rss-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Sequential fetches plus the pause between accounts need more than the old 15 minutes.
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Start RSSHub
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TWITTER_AUTH_TOKEN"
          docker run --rm -d \
            --name rsshub-x \
            --cpus 1 \
            --memory 768m \
            -p 127.0.0.1:1200:1200 \
            -e NODE_ENV=production \
            -e CACHE_TYPE=memory \
            -e MEMORY_MAX=64 \
            -e REQUEST_RETRY=1 \
            -e REQUEST_TIMEOUT=30000 \
            -e NO_LOGFILES=true \
            -e TWITTER_AUTH_TOKEN \
            diygod/rsshub:latest

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:1200/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs rsshub-x
          exit 1

      - name: Generate feed
        run: |
          set -euo pipefail
          mkdir -p public/feeds

          # Lowercase filenames match existing feeds (OpenAI -> openai.xml).
          # @antigravity @AnthropicAI @googlegemma @Z_Lib_official @NotionHQ @Google @naval @ssamat
          # Each entry is "screen_name output_name". BBC Chinese keeps its old filename.
          feeds=(
            "weixin_wechat weixin_wechat"
            "openai openai"
            "github github"
            "claudeai claudeai"
            "elonmusk elonmusk"
            "thsottiaux thsottiaux"
            "antigravity antigravity"
            "anthropicai anthropicai"
            "googlegemma googlegemma"
            "z_lib_official z_lib_official"
            "notionhq notionhq"
            "google google"
            "naval naval"
            "ssamat ssamat"
            "bbcchinese bbchinesd"
          )

          pages_base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/feeds"

          is_feed() {
            grep -Eq '<(rss|feed)([ >])' "$1"
          }

          fetch_feed() {
            local handle="$1"
            local name="$2"
            local dest="public/feeds/${name}.xml"
            local tmp
            tmp="$(mktemp)"

            if curl --fail --silent --show-error \
                --retry 3 --retry-delay 5 --max-time 90 \
                "http://127.0.0.1:1200/twitter/user/${handle}" \
                --output "$tmp" \
              && is_feed "$tmp"; then
              mv "$tmp" "$dest"
              echo "Updated ${name} from @${handle}"
              return 0
            fi

            rm -f "$tmp"
            echo "::warning::Skipping @${handle}; this account will not fail the build"

            # A partial Pages deploy replaces the whole site, so copy the last
            # published file back into this artifact when the new fetch fails.
            if [[ -f "$dest" ]] && is_feed "$dest"; then
              echo "Keeping existing ${dest}"
              return 0
            fi

            tmp="$(mktemp)"
            if curl --fail --silent --show-error --location \
                --retry 2 --retry-delay 2 --max-time 30 \
                "${pages_base}/${name}.xml" \
                --output "$tmp" \
              && is_feed "$tmp"; then
              mv "$tmp" "$dest"
              echo "Kept previous feed for ${name}"
              return 0
            fi

            rm -f "$tmp" "$dest"
            echo "::warning::No previous feed file for ${name}"
            return 0
          }

          i=0
          for entry in "${feeds[@]}"; do
            if [[ "$i" -gt 0 ]]; then
              sleep 5
            fi
            i=$((i + 1))
            read -r handle name <<< "$entry"
            fetch_feed "$handle" "$name"
          done

          kept=0
          for entry in "${feeds[@]}"; do
            name="${entry##* }"
            dest="public/feeds/${name}.xml"
            if [[ -f "$dest" ]] && is_feed "$dest"; then
              kept=$((kept + 1))
            else
              rm -f "$dest"
            fi
          done
          if [[ "$kept" -eq 0 ]]; then
            echo "Every account failed and no previous feed file was available." >&2
            exit 1
          fi
          echo "Ready to publish ${kept} feed(s)."

          {
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="zh-CN">' \
              '<meta charset="utf-8">' \
              '<meta name="viewport" content="width=device-width,initial-scale=1">' \
              '<title>X RSS Feed</title>' \
              '<h1>X RSS Feed</h1>'
            for entry in "${feeds[@]}"; do
              name="${entry##* }"
              if [[ -f "public/feeds/${name}.xml" ]]; then
                printf '<p><a href="feeds/%s.xml">%s</a></p>\n' "$name" "$name"
              fi
            done
          } > public/index.html

      - name: Stop RSSHub
        if: always()
        run: docker stop rsshub-x >/dev/null 2>&1 || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
